services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: lingopass
      POSTGRES_DB: lingolink_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lingo:lingopass@postgres:5432/lingolink_db
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data

volumes:
  pgdata: