<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingoLink Live Translation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e8e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: white;
    }
    .header .status {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
    }
    .ticket-info {
      padding: 10px 16px;
      background: #2a2a3e;
      font-size: 12px;
      color: #a0a0b0;
      border-bottom: 1px solid #3a3a4e;
    }
    .ticket-info strong { color: #e8e8f0; }
    .frame-container {
      flex: 1;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .error {
      padding: 20px;
      text-align: center;
      color: #ff6b6b;
      font-size: 13px;
      display: none;
    }
    .error.show { display: block; }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 10;
    }
    .loading.hide { display: none; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #3a3a4e;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌐 LingoLink Live</h1>
    <span class="status" id="status">Ready</span>
  </div>

  <div class="ticket-info" id="ticketInfo">
    Loading ticket...
  </div>

  <div class="frame-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>
    <div class="error" id="error"></div>
    <iframe
      id="lingolinkFrame"
      src="about:blank"
      allow="microphone; autoplay; clipboard-write"
    ></iframe>
  </div>

  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <script>
    const LINGOLINK_URL = 'http://localhost:3000';

    const client = ZAFClient.init();
    const statusEl = document.getElementById('status');
    const ticketInfoEl = document.getElementById('ticketInfo');
    const frame = document.getElementById('lingolinkFrame');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');

    client.invoke('resize', { width: '100%', height: '100%' });

    client.get(['ticket.id', 'ticket.subject', 'ticket.requester.name', 'ticket.requester.email'])
      .then((data) => {
        const ticket = data.ticket || {};
        const requester = ticket.requester || {};

        ticketInfoEl.innerHTML =
          '<strong>#' + (ticket.id || '?') + '</strong> — ' +
          (ticket.subject || 'No subject') +
          '<br>👤 ' + (requester.name || 'Unknown') +
          ' (' + (requester.email || 'no email') + ')';

        const params = new URLSearchParams({
          zendesk_ticket_id: ticket.id || '',
          zendesk_requester: requester.name || '',
          zendesk_requester_email: requester.email || ''
        });

        frame.src = LINGOLINK_URL + '?' + params.toString();
        statusEl.textContent = 'Connected';
      })
      .catch((err) => {
        console.error('ZAF error:', err);
        ticketInfoEl.textContent = 'Could not load ticket info';
        frame.src = LINGOLINK_URL;
      });

    frame.onload = () => {
      loading.classList.add('hide');
    };

    frame.onerror = () => {
      loading.classList.add('hide');
      errorEl.textContent = 'Could not load LingoLink. Check that the agent console is running at ' + LINGOLINK_URL;
      errorEl.classList.add('show');
    };

    setTimeout(() => {
      loading.classList.add('hide');
    }, 5000);
  </script>
</body>
</html>
